name: BANK 360 — B3 official UCI experiment

on:
  push:
    branches: [main]
    paths:
      - 'bank360/b3_risk.py'
      - 'tests/test_b3.py'
      - 'requirements-ml.txt'
      - '.github/workflows/b3-official-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bank360-b3-official
  cancel-in-progress: false

jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official UCI reader and CPU ML libraries
        run: python -m pip install -r requirements-uci.txt -r requirements-ml.txt
      - name: Download and verify the original historical source
        run: |
          python -m bank360 run --source official
          python -m bank360 validate
      - name: Train, compare, audit and evaluate on an untouched test holdout
        run: python -m bank360.b3_risk --db data/bank360.sqlite --out reports/b3
      - name: Independently audit published aggregate metrics
        run: |
          python - <<'PY'
          import json, csv, pathlib
          p=pathlib.Path('reports/b3');r=json.loads((p/'B3-metrics.json').read_text())
          assert r['status']=='PASS'
          assert r['dataset']['population']==30000 and r['dataset']['defaults']==6636
          assert [r['protocol'][x] for x in ('train_n','validation_n','test_n')]==[18000,6000,6000]
          assert r['selected_model'] in ('logistic_regression','hist_gradient_boosting')
          assert set(r['protocol']['features']).isdisjoint(r['protocol']['excluded_predictors'])
          m=r['holdout_test_metrics']
          assert m['confusion']['tp']+m['confusion']['tn']+m['confusion']['fp']+m['confusion']['fn']==6000
          assert m['pr_auc']>r['holdout_prevalence_baseline']['pr_auc']
          assert m['brier']<r['holdout_prevalence_baseline']['brier']
          with (p/'B3-risk-deciles.csv').open() as f: d=list(csv.DictReader(f))
          assert len(d)==10 and sum(int(x['n']) for x in d)==6000
          with (p/'B3-subgroup-audit.csv').open() as f: a=list(csv.DictReader(f))
          assert all(x['field'] in ('sex_code','age_band') for x in a)
          assert all(k not in r for k in ('predictions','client_ids','individual_scores'))
          print('B3 official UCI audit PASS: public aggregate outputs only')
          PY
      - name: Upload short-lived aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: bank360-b3-aggregate-research
          path: reports/b3/
          retention-days: 30
      - name: Commit ONLY aggregate research reports (no raw records or model binary)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/b3/B3-metrics.json reports/b3/B3-model-card.md reports/b3/B3-risk-deciles.csv reports/b3/B3-calibration.csv reports/b3/B3-subgroup-audit.csv reports/b3/B3-feature-importance.csv
          if git diff --cached --quiet; then
            echo 'No B3 metrics changes'
          else
            git commit -m 'data(B3): refresh UCI350 aggregate model evaluation [skip ci]'
            git push origin HEAD:main
          fi
