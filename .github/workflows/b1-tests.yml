name: BANK 360 — B1 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  b1-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline Python tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic fixture end-to-end validation (not real banking data)
        run: |
          python -m bank360 build --input examples/demo_credit_24.csv --origin synthetic-test --demo --expected-rows 24
          python -m bank360 validate
