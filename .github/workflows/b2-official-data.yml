name: BANK 360 — B2 official aggregate data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-b2-aggregates.py'
      - '.github/workflows/b2-official-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-aggregates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official UCI reader
        run: python -m pip install -r requirements-uci.txt
      - name: Import UCI original; run B1 checks
        run: |
          python -m bank360 run --source official
          python -m bank360 validate
      - name: Produce grouped, safe Power BI snapshots
        run: python scripts/build-b2-aggregates.py
      - name: Test B2 snapshots and PBIR structure
        run: python -m unittest tests.test_b2 -v
      - name: Commit grouped CSV only (not client-level data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f powerbi/data/uci350_segments.csv powerbi/data/uci350_payment_months.csv powerbi/data/B2-aggregation-manifest.json
          if git diff --cached --quiet; then
            echo 'No changes in B2 aggregate snapshots'
          else
            git commit -m "data: refresh public UCI350 aggregate snapshot for B2 [skip ci]"
            git push origin HEAD:main
          fi
