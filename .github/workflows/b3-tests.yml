name: BANK 360 — B3 offline ML tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'bank360/b3_risk.py'
      - 'tests/test_b3.py'
      - 'requirements-ml.txt'
      - '.github/workflows/b3-tests.yml'

permissions:
  contents: read

jobs:
  experiment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU model dependencies
        run: python -m pip install -r requirements-ml.txt
      - name: Run B3 leakage and reproducibility tests on synthetic data
        run: python -m unittest discover -s tests -p 'test_b3.py' -v
