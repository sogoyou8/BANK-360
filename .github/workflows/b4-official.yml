name: BANK 360 — B4 official PaySim fraud research
on:
  push:
    branches: [main]
    paths:
      - 'bank360/b4_fraud.py'
      - 'requirements-b4.txt'
      - '.github/workflows/b4-official.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  paysim-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install -r requirements-b4.txt
      - name: Run synthetic tests before download
        run: python -m unittest tests.test_b4 -v
      - name: Download exact Kaggle PaySim original; train and evaluate temporal holdout
        run: python -m bank360.b4_fraud --download --out reports/b4
      - name: Independently reconcile aggregate report (no source rows)
        run: python scripts/validate-b4-report.py
      - name: Publish audit outputs as short-lived artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BANK-360-B4-aggregate-evidence
          path: reports/b4/B4-*
          retention-days: 30
          if-no-files-found: warn
      - name: Commit only aggregate fraud-research results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/b4/B4-metrics.json reports/b4/B4-model-card.md reports/b4/B4-alerts-by-type.csv reports/b4/B4-alerts-by-simulated-day.csv reports/b4/B4-risk-deciles.csv
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'data(B4): publish aggregate PaySim research evidence [skip ci]'
            git push origin HEAD:main
          fi
