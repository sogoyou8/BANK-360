name: BANK 360 — B4 offline fraud tests
on:
  push:
    paths:
      - 'bank360/b4_fraud.py'
      - 'tests/test_b4.py'
      - 'requirements-b4.txt'
      - '.github/workflows/b4-offline.yml'
  pull_request:
    paths:
      - 'bank360/b4_fraud.py'
      - 'tests/test_b4.py'
      - 'requirements-b4.txt'
      - '.github/workflows/b4-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install B4 ML dependencies
        run: python -m pip install -r requirements-b4.txt
      - name: Run synthetic unit and end-to-end tests
        run: python -m unittest tests.test_b4 -v
      - name: Check that codebase contains no raw payment CSV or modeled account scores
        run: |
          if git ls-files | grep -E '(^data/raw/.*\.(csv|zip|parquet|pkl|joblib)$|^reports/b4/.*(transaction|score|raw|\.pkl|\.joblib))'; then
            echo 'ERROR: raw transaction or score export committed'; exit 1
          fi
          echo 'No raw PaySim records or per-account scores committed'
